<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulátor vytápění</title>
<style>
  :root { --ink: #1c2430; --muted: #5d6673; --line: #d9dde3; --accent: #2f5d8a; --bg: #f6f7f9; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; color: var(--ink); background: var(--bg); }
  main { max-width: 880px; margin: 0 auto; padding: 40px 16px; }
  h1 { margin: 0 0 6px; font-size: 30px; }
  .muted { color: var(--muted); }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; margin-top: 24px; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--accent); color: #fff; }
  .badge.test { background: #b07a12; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 14px 0 0; }
  dt { color: var(--muted); }
  dd { margin: 0; font-weight: 600; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Simulátor vytápění</h1>
  <p class="muted">Aplikace se připravuje v rámci předmětu KKY/AKS. Tato stránka zatím ukazuje, která verze je nasazená a jak nasazení proběhlo.</p>

  <section class="card">
    <span id="env" class="badge">–</span>
    <dl>
      <dt>Verze</dt><dd id="version">–</dd>
      <dt>Nasazeno</dt><dd id="deployed">–</dd>
      <dt>Žádost podána</dt><dd id="requested">–</dd>
      <dt>Doba od žádosti po nasazení</dt><dd id="lead">–</dd>
      <dt>Žadatel</dt><dd id="by">–</dd>
      <dt>Schválil</dt><dd id="approved">–</dd>
      <dt>Spuštěno z</dt><dd id="flow">–</dd>
    </dl>
  </section>

  <section class="card">
    <h2 style="margin:0 0 12px;font-size:20px">Historie nasazení</h2>
    <div class="scroll"><table id="log"><tbody><tr><td class="muted">Zatím žádné nasazení.</td></tr></tbody></table></div>
  </section>
</main>
<script>
  function fmt(iso) {
    if (!iso) return '–';
    var d = new Date(iso);
    return isNaN(d) ? iso : d.toLocaleString('cs-CZ');
  }
  function lead(a, b) {
    var s = (new Date(b) - new Date(a)) / 1000;
    if (!a || !b || isNaN(s) || s < 0) return '–';
    var m = Math.floor(s / 60), r = Math.round(s % 60);
    return m ? m + ' min ' + r + ' s' : r + ' s';
  }
  fetch('deploy-info.json', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (i) {
    if (!i) return;
    var env = document.getElementById('env');
    env.textContent = i.environment === 'test' ? 'Testovací prostředí' : 'Produkce';
    env.className = 'badge' + (i.environment === 'test' ? ' test' : '');
    document.getElementById('version').textContent = i.version;
    document.getElementById('deployed').textContent = fmt(i.deployed_at);
    document.getElementById('requested').textContent = fmt(i.requested_at);
    document.getElementById('lead').textContent = lead(i.requested_at, i.deployed_at);
    document.getElementById('by').textContent = i.requested_by || '–';
    document.getElementById('approved').textContent = i.approved_by || '–';
    document.getElementById('flow').textContent = i.flow || '–';
  }).catch(function () {});
  fetch('log.csv', { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (t) {
    var rows = t.trim().split('\n').filter(Boolean);
    if (rows.length < 2) return;
    var head = ['Nasazeno', 'Verze', 'Prostředí', 'Žadatel', 'Schválil', 'Flow', 'Od žádosti'];
    var html = '<thead><tr>' + head.map(function (h) { return '<th>' + h + '</th>'; }).join('') + '</tr></thead><tbody>';
    rows.slice(1).reverse().forEach(function (line) {
      var c = line.split(',');
      var cells = [fmt(c[0]), c[2], c[3], c[4] || '–', c[5] || '–', c[6] || '–', lead(c[1], c[0])];
      html += '<tr>' + cells.map(function (x) { return '<td>' + String(x).replace(/</g, '&lt;') + '</td>'; }).join('') + '</tr>';
    });
    document.getElementById('log').innerHTML = html + '</tbody>';
  }).catch(function () {});
</script>
</body>
</html>
